# MLflow instance configuration

mlflow:
  name: mlflow

  # Leave empty to use the operator image. Only override with a validated image
  # compatible with the installed RHOAI release; never use a cluster-local image.
  image:
    image: ""
    imagePullPolicy: IfNotPresent

  storage:
    accessModes:
      - ReadWriteOnce
    size: 100Gi

  backend:
    storeUri: "sqlite:////mlflow/mlflow.db"

  artifacts:
    destination: "file:///mlflow/artifacts"
    serve: true
