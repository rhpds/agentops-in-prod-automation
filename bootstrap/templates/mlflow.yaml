---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  labels:
    demo.redhat.com/application: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: mlflow
  project: default
  source:
    path: deployments/mlflow
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    {{- if .Values.mlflow.image.image }}
    helm:
      valuesObject:
        mlflow:
          image:
            {{- toYaml .Values.mlflow.image | nindent 12 }}
    {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
